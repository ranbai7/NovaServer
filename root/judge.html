<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebServer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #e6e9f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #fff;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 380px;
            max-width: 90vw;
        }
        .card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        .card p {
            color: #888;
            font-size: 14px;
            margin-bottom: 36px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-primary {
            background: #4f6ef7;
            color: #fff;
        }
        .btn-primary:hover {
            background: #3b54d4;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 110, 247, 0.4);
        }
        .btn-outline {
            background: #fff;
            color: #4f6ef7;
            border: 2px solid #4f6ef7;
        }
        .btn-outline:hover {
            background: #f0f4ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌐 WebServer</h1>
        <p>轻量级高并发 HTTP 服务</p>
        <form action="0" method="post">
            <button class="btn btn-outline" type="submit">新用户注册</button>
        </form>
        <form action="1" method="post">
            <button class="btn btn-primary" type="submit">已有账号登录</button>
        </form>
    </div>
</body>
</html>
