# NovaServer 配置示例
#
# 复制为 config.ini 后按实际环境修改。config.ini 已被 .gitignore 忽略，
# 避免把数据库口令一类的本地取值提交到仓库。
#
# 命令行参数优先于此处的取值：例如配置文件写了 port = 9006、命令行又给出
# -p 9007，最终以 9007 为准。因此可以两者混用——把口令放在配置文件里，
# 临时需要换端口时用命令行覆盖。
#
# 以 # 或 ; 开头的行是注释；取值可加双引号以保留首尾空白。
# 无法识别的键会被视为错误并终止启动，以免「改了配置却没生效」不易察觉。

[server]
# 监听端口
port = 9006
# 触发模式组合：0 = LT+LT，1 = LT+ET，2 = ET+LT，3 = ET+ET
trig_mode = 0
# 优雅关闭连接：0 = 不使用，1 = 使用
opt_linger = 0
# 子 Reactor 线程数：0 表示不建子线程，全部连接归主循环
thread_num = 8
# 关闭日志：0 = 打开，1 = 关闭
close_log = 0
# 站点根目录，相对路径以启动时的工作目录为基准
root_dir = ./root

[database]
host = 127.0.0.1
port = 3306
user = root
# 口令留空时按空口令连接，请按实际环境填写
password = ""
database = yourdb
# 连接池中的连接数量
pool_size = 8

[log]
# 写入方式：0 = 同步，1 = 异步
# 同步：每写一行就落盘，进程崩溃不丢日志，代价是每行的写入开销都压在调用线程上
# 异步（默认）：写入线程私有的缓冲，由专门的写盘线程按整块批量落盘。
#     代价是进程被 SIGKILL 或崩溃时，最多丢掉「刷新间隔」内的日志
write_mode = 1
# 日志存放目录与文件名前缀。实际文件名为「目录/日期_文件名」
dir = ./ServerLog
file = server
# 单条日志的长度上限，取值会被夹到 [128, 4096]
buf_size = 2000
# 单个日志文件的最大行数。这是**软**上限：写入以整块为单位，
# 文件可能多出不到一块的行数
split_lines = 800000
# 缓冲块大小，落盘以整块为单位。取值会被夹到 [4096, 8388608]，
# 内存中最多保留 9 块
batch_buf_size = 65536
# 异步写入的定时刷新间隔（毫秒）：缓冲未写满时，也会按该间隔落盘
flush_interval = 1000
